# JobTool board theme: dark base + mint accent.
# board.py matches its plotly charts to these values (ACCENT / dark template).
[theme]
base = "dark"
primaryColor = "#00E5A0"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1F2B"
textColor = "#FAFAFA"
font = "sans serif"

[server]
headless = true
