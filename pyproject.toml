[project]
name = "jobtool"
version = "0.1.0"
description = "Personal job-matching ingestion tool (JobSpy + Greenhouse/Lever ATS)"
requires-python = "==3.12.*"
dependencies = [
    "python-jobspy>=1.1",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "fastembed>=0.3",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "streamlit>=1.64.0",
    "python-dotenv>=1.2.3",
    "plotly>=7.1.0",
]
